<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Dynacorp 2092</title>
    <link rel="stylesheet" href="./src/ui/game.css" />
  </head>
  <body>
    <div id="start" class="start"></div>

    <div id="game" hidden>
      <header class="top">
        <div class="firm"><b id="firm"></b><span id="day"></span></div>
        <div class="money">
          <span>Bar <b id="cash"></b></span>
          <span class="muted">Schulden <b id="debt"></b></span>
          <span id="quark"></span>
        </div>
        <div class="time" data-guide="time">
          <button data-act="speed" data-a="0" aria-label="Pause" data-tip="Hält die Zeit an. Im Pausenmodus kannst du in Ruhe planen.">❚❚</button>
          <button data-act="speed" data-a="1" aria-label="Normale Geschwindigkeit" data-tip="Normale Geschwindigkeit: ein Spieltag alle 6 Sekunden.">▶ 1×</button>
          <button data-act="speed" data-a="2" data-tip="Doppelte Geschwindigkeit: ein Tag alle 3 Sekunden.">2×</button>
          <button data-act="speed" data-a="4" data-tip="Vierfache Geschwindigkeit: ein Tag alle 1,5 Sekunden.">4×</button>
          <button data-act="step-day" class="ghost" data-tip="Hält an und spielt genau einen Tag weiter.">+1 Tag</button>
        </div>
        <div class="menu">
          <button id="help" data-act="guide-show" class="ghost" hidden>Hilfe</button>
          <button data-act="menu" class="ghost" aria-label="Menü">☰</button>
        </div>
      </header>
      <div id="ticker" class="ticker" data-act="tab" data-a="stats"></div>
      <div class="layout">
        <aside class="side"><div id="guide" class="guide"></div><div id="map-dock" class="map-dock" hidden></div></aside>
        <main id="view"></main>
      </div>
      <nav id="nav" class="nav"></nav>
    </div>

    <div id="sheet" class="sheet" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <div id="tip" class="tip" role="tooltip" hidden></div>
    <script type="module" src="./src/ui/game.ts"></script>
  </body>
</html>
