<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Dynacorp 2092 – Beobachtungsmodus</title>
    <link rel="stylesheet" href="./src/ui/debug.css" />
  </head>
  <body>
    <header>
      <h1>Dynacorp 2092</h1>
      <p class="sub">Beobachtungsmodus – 20 KI-Firmen spielen allein · <a href="./index.html">zum Spiel</a></p>
    </header>
    <section class="controls">
      <span id="day">Tag 0</span>
      <button data-days="1">+1 Tag</button>
      <button data-days="10">+10</button>
      <button data-days="50">+50</button>
      <button id="auto">Auto ▶</button>
      <button id="reset">Neu</button>
    </section>
    <section id="status" class="status"></section>
    <main>
      <article>
        <h2>Rangliste</h2>
        <table id="ranking"></table>
      </article>
      <article>
        <h2>Kurse</h2>
        <table id="prices"></table>
      </article>
      <article>
        <h2>Anlagen</h2>
        <table id="facilities"></table>
      </article>
      <article>
        <h2>Ticker</h2>
        <ol id="ticker"></ol>
      </article>
    </main>
    <script type="module" src="./src/ui/debug.ts"></script>
  </body>
</html>
